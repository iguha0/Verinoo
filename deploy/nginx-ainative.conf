# /etc/nginx/sites-available/ainative
# Replace DOMAIN with your hostname, then:
#   sudo ln -s /etc/nginx/sites-available/ainative /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMAIN        # adds the 443 block automatically

limit_req_zone $binary_remote_addr zone=ainapi:10m rate=20r/s;

# HTTP -> HTTPS (after `certbot --nginx -d DOMAIN` issued the cert)
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;
    return 301 https://DOMAIN$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    # --- static landing site (fast, survives node restarts) ---
    root /var/www/ainative;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    # --- chain API proxied to the gateway node ---
    location ~ ^/(status|blocks|tx|models|tasks|nodes|agents|peers|accounts|games|health)(/|$) {
        limit_req zone=ainapi burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    # live dashboard (proxied; it polls the API from the browser)
    location = /dashboard {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    location = / {
        try_files /index.html =404;
    }

    # never expose raw node data or env files if docroot ever changes
    location ~ /\. { deny all; }
}
